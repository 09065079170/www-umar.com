<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 30px;
        }

        .product {
            background-color: white;
            max-width: 300px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
        }

        .product img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
        }

        .button {
            display: inline-block;
            background-color: green;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>My Products</h1>
    <p>Welcome to my products page.</p>

    <div class="product">
        <img src="products.jpg" alt="My Product">

        <h2>My Product</h2>
        <p>Price: ₦10,000</p>

        <a class="button" href="#">Buy Now</a>
    </div>

</body>
</html>

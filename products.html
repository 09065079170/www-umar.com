<!DOCTYPE html>
<html>
<head>
    <title>My Products</title>

    <style>
        body {
            background-color: lightblue;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
        }

        h1 {
            text-align: center;
            color: blue;
        }

        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
        }

        .products {
            background-color: white;
            width: 100px;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }

        .products img {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 5px;
        }

        .products h2 {
            color: blue;
        }

        .price {
            font-size: 5px;
            font-weight: normal;
        }

        button {
            background-color: orange;
            color: white;
            border: none;
            padding: 5px 5px;
            border-radius: 5px;
            font-size: 5px;
        }
    </style>

<body>

    <h1>My Products</h1>

    < class="products">

        <div class="product">

            <img src="laptop.jpg" alt="Silver Laptop">

            <h2>14.1" Silver Laptop</h2>

            <p>8GB RAM | 256GB SSD</p>

            <p>Intel N5100 | 1920x1080 IPS</p>

            <p class="price">₦383,610</p>

            <button>Add to Cart</button>

        </div>

</body>
</head>
</html>
